name: PhraseDeck
options:
  bundleIdPrefix: com.yerled
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.yerled.PhraseDeck
targets:
  PhraseDeck:
    type: application
    platform: macOS
    sources:
      - path: PhraseDeck
        excludes:
          - Resources/Info.plist
          - Resources/PhraseDeck.entitlements
    resources:
      - path: PhraseDeck/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: PhraseDeck
        PRODUCT_BUNDLE_IDENTIFIER: com.yerled.PhraseDeck
        INFOPLIST_FILE: PhraseDeck/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        OTHER_LDFLAGS: "$(inherited) -framework ScreenCaptureKit -framework Vision"
        CODE_SIGN_ENTITLEMENTS: PhraseDeck/Resources/PhraseDeck.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_EMIT_LOC_STRINGS: true
    info:
      path: PhraseDeck/Resources/Info.plist
      properties:
        CFBundleName: PhraseDeck
        CFBundleDisplayName: PhraseDeck
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 yerled"
        NSPrincipalClass: NSApplication
scheme:
  PhraseDeck:
    build:
      targets:
        PhraseDeck: all
    run:
      config: Debug
